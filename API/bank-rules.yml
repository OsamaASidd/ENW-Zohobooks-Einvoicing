        tax_authority_name:
          $ref: '#/components/schemas/tax_authority_name'
        tax_exemption_code:
          $ref: '#/components/schemas/tax_exemption_code'
    update-a-rule-request:
      required:
        - rule_name
        - rule_category
        - apply_to
        - criteria_type
        - criterion
        - record_as
      type: object
      properties:
        rule_name:
          $ref: '#/components/schemas/rule_name'
        rule_category:
          $ref: '#/components/schemas/rule_category'
        account_ids:
          $ref: '#/components/schemas/account_ids'
        apply_to:
          description: 'Specifies whether the rule applies to deposits or withdrawals. This applies to both bank accounts and credit card accounts. Allowed Values: <code>deposits</code>, <code>withdrawals</code>.'
          type: string
          example: deposits
        criteria_type:
          description: 'Specifies whether all the criteria have to be satisfied or not. Allowed Values : <code>and</code> and <code>or</code>'
          type: string
          example: and
        auto_categorize:
          $ref: '#/components/schemas/auto_categorize'
        criterion:
          $ref: '#/components/schemas/criterion'
        record_as:
          description: 'Record the transaction based on the value specified in the apply_to node. For bank accounts: If apply_to is deposits: sales_without_invoices, transfer_fund, interest_income, other_income, expense_refund, deposit. If apply_to is withdrawals: expense, transfer_fund, card_payment, owner_drawings. For credit card accounts: If apply_to is deposits: card_payment, transfer_fund, expense_refund, refund. If apply_to is withdrawals: expense, transfer_fund. Allowed Values: expense, deposit, refund, transfer_fund, card_payment, sales_without_invoices, expense_refund, interest_income, other_income, owner_drawings.'
          type: string
          example: deposit
        account_id:
          description: Account which is involved in the rule with the target account.
          type: string
          example: 460000000049001
        customer_id:
          description: ID of the customer.(Applicable for sales_without_invoices,deposit, expense)
          type: string
          example: 46000000000111
        tax_id:
          $ref: '#/components/schemas/tax_id'
        reference_number:
          description: 'Specifies if Reference number is manual or generated from the statement. Allowed Values: <code>manual</code> and <code>from_statement</code>'
          type: string
          example: manual
        vat_treatment:
          $ref: '#/components/schemas/vat_treatment'
        tax_treatment:
          $ref: '#/components/schemas/tax_treatment'
        is_reverse_charge_applied:
          $ref: '#/components/schemas/is_reverse_charge_applied'
        product_type:
          $ref: '#/components/schemas/product_type'
        tax_authority_id:
          $ref: '#/components/schemas/tax_authority_id'
        tax_exemption_id:
          $ref: '#/components/schemas/tax_exemption_id'
        location_id:
          $ref: '#/components/schemas/location_id'
