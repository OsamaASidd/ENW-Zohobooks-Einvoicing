openapi: 3.0.0
info:
  title: Bank Rules
  description: In Zoho Books, you can automate the categorization of the bank feeds. The transaction rules feature in banking will help you in automatically identifying the bank transaction and categorizing it under the criteria provided by you.
  contact: {}
  version: 1.0.0
servers:
  - url: https://www.zohoapis.com/books/v3
    description: API Endpoint
tags:
  - name: bank-rules
    description: Bank-Rules Module
paths:
  /bankaccounts/rules:
    x-mcp-group:
      - Bank Rules
    get:
      tags:
        - bank-rules
      operationId: list_bank_account_rules
      summary: Get Rules List
      description: Fetch all the rules created in the organization.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-rules-list-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.READ
    post:
      tags:
        - bank-rules
      operationId: create_bank_account_rule
      summary: Create a rule
      description: Create a rule and apply it on deposit/withdrawal for bank accounts and on refund/charges for credit card accounts.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-a-rule-request'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-a-rule-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.CREATE
    put:
      tags:
        - bank-rules
      operationId: bulk_update_bank_account_rules
      summary: Bulk update rules
      description: Update multiple bank rules in a single request.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bulk-update-bank-account-rules-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.UPDATE
    delete:
      tags:
        - bank-rules
      operationId: bulk_delete_bank_account_rules
      summary: Bulk delete rules
      description: Delete multiple bank rules in a single request.
      parameters:
        - name: rule_ids
          in: query
          required: true
          description: 'Comma-separated IDs of the rules to delete. Note: This value is a set of numeric characters separated by comma.'
          schema:
            type: string
          example: 460000000050001,460000000050002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bulk-delete-bank-account-rules-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.DELETE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /bankaccounts/rules/{rule_id}:
    x-mcp-group:
      - Bank Rules
    get:
      tags:
        - bank-rules
      operationId: get_bank_account_rule
      summary: Get a rule
      description: Get details of a specific rule.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-a-rule-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.READ
    put:
      tags:
        - bank-rules
      operationId: update_bank_account_rule
      summary: Update a rule
      description: Make changes to the rule, add or modify it and update.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-a-rule-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-a-rule-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.UPDATE
    delete:
      tags:
        - bank-rules
      operationId: delete_bank_account_rule
      summary: Delete a rule
      description: Delete a rule from your account and make it no longer applicable on the transactions.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-a-rule-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.DELETE
    parameters:
      - name: rule_id
        in: path
        required: true
        description: Unique identifier of the bank account rule.
        schema:
          type: string
        example: '460000000048005'
      - $ref: '#/components/parameters/organization_id'
  /bankaccounts/rules/order:
    x-mcp-group:
      - Bank Rules
    post:
      tags:
        - bank-rules
      operationId: reorder_bank_account_rules
      summary: Reorder rules
      description: Change the order in which bank rules are evaluated.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reorder-bank-account-rules-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.CREATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /bankaccounts/rules/skipsuggest:
    x-mcp-group:
      - Bank Rules
    post:
      tags:
        - bank-rules
      operationId: skip_suggested_bank_account_rule
      summary: Skip a suggested rule
      description: Dismiss a bank rule suggested by Zoho Books.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skip-suggested-bank-account-rule-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.CREATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /bankaccounts/matchfilters:
    x-mcp-group:
      - Bank Rules
    get:
      tags:
        - bank-rules
      operationId: list_bank_account_match_filters
      summary: List match filters
      description: List the match filters used to identify bank transactions for rules.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list-bank-account-match-filters-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.READ
    post:
      tags:
        - bank-rules
      operationId: create_bank_account_match_filter
      summary: Create a match filter
      description: Create a match filter used to identify bank transactions for rules.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bank-account-match-filter-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-bank-account-match-filter-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.CREATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /bankaccounts/matchfilters/{match_filter_id}:
    x-mcp-group:
      - Bank Rules
    put:
      tags:
        - bank-rules
      operationId: update_bank_account_match_filter
      summary: Update a match filter
      description: Update a match filter used to identify bank transactions for rules.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bank-account-match-filter-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-bank-account-match-filter-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.UPDATE
    delete:
      tags:
        - bank-rules
      operationId: delete_bank_account_match_filter
      summary: Delete a match filter
      description: Delete a match filter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-bank-account-match-filter-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.banking.DELETE
    parameters:
      - name: match_filter_id
        in: path
        required: true
        description: 'Unique identifier of the match filter. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: '460000000050010'
      - $ref: '#/components/parameters/organization_id'
components:
  parameters:
    organization_id:
      name: organization_id
      description: ID of the organization
      in: query
      required: true
      schema:
        type: string
      example: '10234695'
  schemas:
    gendoc-attributes-schema:
      $ref: '#/components/schemas/rules-response'
    rules-response:
      type: object
      properties:
        rule_id:
          $ref: '#/components/schemas/rule_id'
        rule_name:
          $ref: '#/components/schemas/rule_name'
        rule_order:
          $ref: '#/components/schemas/rule_order'
        rule_category:
          $ref: '#/components/schemas/rule_category'
        target_accounts_formatted:
          $ref: '#/components/schemas/target_accounts_formatted'
        target_accounts_count:
          $ref: '#/components/schemas/target_accounts_count'
        apply_to:
          $ref: '#/components/schemas/apply_to'
        criteria_type:
          $ref: '#/components/schemas/criteria_type'
        record_as:
          $ref: '#/components/schemas/record_as'
        account_id:
          $ref: '#/components/schemas/account_id'
        account_name:
          $ref: '#/components/schemas/account_name'
        criterion:
          $ref: '#/components/schemas/criterion'
    account_id:
      description: Account ID of the Bank
      type: string
      example: '460000000000361'
    rule_id:
      description: ID of the Rule
      type: string
      example: '460000000048005'
    rule_name:
      description: Name of the Rule
      type: string
      example: Minimum Deposit Rule
    rule_order:
      description: Order of the rule
      type: integer
      example: 0
    apply_to:
      description: Entities to which Rule must be applied
      type: string
      example: deposits
    criteria_type:
      description: Type of Criteria
      type: string
      example: and
    record_as:
      description: Entity as which it should be recorded
      type: string
      example: deposit
    account_name:
      description: Name of the account
      type: string
      example: Petty Cash
    criteria_id:
      description: ID of the Criteria
      type: string
      example: '460000000048009'
    field:
      description: Field involved in the Criteria
      type: string
      example: amount
    comparator:
      description: Comparator used in Criteria
      type: string
      example: greater_than_or_equals
    value:
      description: Value to be compared with
      type: string
      example: '500.00'
    criterion:
      type: array
      description: List of criteria based on which the rule will be applied.
      items:
        type: object
        properties:
          criteria_id:
            $ref: '#/components/schemas/criteria_id'
          field:
            $ref: '#/components/schemas/field'
          comparator:
            $ref: '#/components/schemas/comparator'
          value:
            $ref: '#/components/schemas/value'
    target_account_name:
      description: Name of the bank or credit card account associated with the rule.
      type: string
      example: Savings Account
    target_accounts_count:
      description: Total number of accounts the rule applies to.
      type: integer
      example: 2
    auto_categorize:
      description: 'Specifies the auto-categorization behavior when the rule criteria are matched. <code>recognize</code>: Matching bank statements are recognized by the rule and can be categorized manually. <code>autocategorize</code>: Matching bank statements are automatically categorized in Zoho Books based on the rule. Allowed Values: <code>autocategorize</code> and <code>recognize</code>.'
      type: string
      example: recognize
    location_id:
      description: 'Unique identifier of the business location to associate with the rule. Use the <code>location_id</code> returned by the Locations API for the same organization. Note: This value is a set of numeric characters.'
      type: string
      example: '460000000003373'
    location_name:
      description: Name of the location.
      type: string
      example: Head Office
    tax_id:
      description: Tax ID involved in the transaction.
      type: string
      example: '460000000048238'
    customer_id:
      description: ID of the Customer Associated with the Rule
      type: string
      example: '46000000000111'
    customer_name:
      description: Name of the Customer Associated with the Rule
      type: string
      example: Trendz
    reference_number:
      description: Specifies if Reference number is manual or generated from the statement.
      type: string
      example: from_statement
    payment_mode:
      description: Payment Mode Associated with the Rule
      type: string
      example: Cash
    vat_treatment:
      description: (Optional) VAT treatment for the bank rules. VAT treatment denotes the location of the customer, if the customer resides in UK then the VAT treatment is <code>uk</code>. If the customer is in an EU country & VAT registered, you are resides in Northen Ireland and selling/purchasing Goods then his VAT treatment is <code>eu_vat_registered</code>, if he resides outside of the UK then his VAT treatment is <code>overseas</code> (For Pre Brexit, this can be split as <code>eu_vat_registered</code>, <code>eu_vat_not_registered</code> and <code>non_eu</code>).
      type: string
      x-node_available_in:
        - uk
      x-node_unavailable_in: []
    tax_treatment:
      description: 'VAT treatment for the bank transaction.Choose whether the contact falls under: <code>vat_registered</code>,<code>vat_not_registered</code>,<code>gcc_vat_not_registered</code>,<code>gcc_vat_registered</code>,<code>non_gcc</code>.</br><code>dz_vat_registered</code> and <code>dz_vat_not_registered</code> are supported only for <b>UAE</b>.<br/><b>For Kenya Edition:</b> <code>vat_registered</code> ,<code>vat_not_registered</code> ,<code>non_kenya</code>(A business that is located outside Kenya).<br/><b>For SouthAfrica Edition:</b> <code>vat_registered</code>, <code>vat_not_registered</code>, <code>overseas</code>(A business that is located outside SouthAfrica).'
      type: string
      example: vat_registered
      x-node_available_in:
        - gcc
        - ke
        - za
      x-node_unavailable_in: []
    is_reverse_charge_applied:
      description: (Required if customer tax treatment is <code>vat_registered</code>)<br/>Used to specify whether the transaction is applicable for Domestic Reverse Charge (DRC) or not.
      type: boolean
      example: true
      x-node_available_in:
        - za
      x-node_unavailable_in: []
    product_type:
      description: 'Product Type associated with the Rule. Allowed values:<br/> <b>For UK and Europe: </b><code>digital_service</code>, <code>goods</code> and <code>service</code>.<br/><b>For SouthAfrica Edition:</b> <code>service</code>, <code>goods</code>, <code>capital_service</code> and <code>capital_goods</code>.'
      type: string
      x-node_available_in:
        - uk
        - za
        - eu
      x-node_unavailable_in: []
    tax_authority_id:
      description: ID of the Tax Authority Associated with the Rule
      type: string
      x-node_available_in:
        - us
      x-node_unavailable_in: []
    tax_authority_name:
      description: Name of the Tax Authority Associated with the Rule
      type: string
      x-node_available_in:
        - us
      x-node_unavailable_in: []
    tax_exemption_id:
      description: ID of the Tax Exemption Associated with the Rule
      type: string
      x-node_available_in:
        - in
        - us
      x-node_unavailable_in: []
    tax_exemption_code:
      description: Code of the Tax Exemption Associated with the Rule
      type: string
      x-node_available_in:
        - in
        - us
      x-node_unavailable_in: []
    rule:
      type: object
      properties:
        rule_id:
          $ref: '#/components/schemas/rule_id'
        rule_name:
          $ref: '#/components/schemas/rule_name'
        rule_order:
          $ref: '#/components/schemas/rule_order'
        rule_category:
          $ref: '#/components/schemas/rule_category'
        target_accounts:
          $ref: '#/components/schemas/target_accounts'
        accounts:
          $ref: '#/components/schemas/accounts'
        target_accounts_count:
          $ref: '#/components/schemas/target_accounts_count'
        apply_to:
          $ref: '#/components/schemas/apply_to'
        criteria_type:
          $ref: '#/components/schemas/criteria_type'
        auto_categorize:
          $ref: '#/components/schemas/auto_categorize'
        location_id:
          $ref: '#/components/schemas/location_id'
        location_name:
          $ref: '#/components/schemas/location_name'
        criterion:
          $ref: '#/components/schemas/criterion'
        record_as:
          $ref: '#/components/schemas/record_as'
        account_id:
          $ref: '#/components/schemas/account_id'
        account_name:
          $ref: '#/components/schemas/account_name'
        tax_id:
          $ref: '#/components/schemas/tax_id'
        customer_id:
          $ref: '#/components/schemas/customer_id'
        customer_name:
          $ref: '#/components/schemas/customer_name'
        reference_number:
          $ref: '#/components/schemas/reference_number'
        payment_mode:
          $ref: '#/components/schemas/payment_mode'
        vat_treatment:
          $ref: '#/components/schemas/vat_treatment'
        tax_treatment:
          $ref: '#/components/schemas/tax_treatment'
        is_reverse_charge_applied:
          $ref: '#/components/schemas/is_reverse_charge_applied'
        product_type:
          $ref: '#/components/schemas/product_type'
        tax_authority_id:
          $ref: '#/components/schemas/tax_authority_id'
        tax_authority_name:
          $ref: '#/components/schemas/tax_authority_name'
        tax_exemption_code:
          $ref: '#/components/schemas/tax_exemption_code'
    target_account_id:
      description: The account on which the rule has to be applied.
      type: string
      example: 460000000048001
    target_accounts:
      type: array
      description: List of bank or credit card accounts on which the rule is applied.
      example:
        - target_account_id: '460000000048001'
          target_account_name: Savings Account
        - target_account_id: '460000000049001'
          target_account_name: Checking Account
      items:
        type: object
        properties:
          target_account_id:
            $ref: '#/components/schemas/target_account_id'
          target_account_name:
            $ref: '#/components/schemas/target_account_name'
    accounts:
      type: array
      description: List of accounts associated with the rule.
      example:
        - account_id: '460000000048001'
          account_name: Savings Account
        - account_id: '460000000049001'
          account_name: Checking Account
      items:
        type: object
        properties:
          account_id:
            $ref: '#/components/schemas/account_id'
          account_name:
            $ref: '#/components/schemas/account_name'
    rule_category:
      description: 'Specifies the scope of accounts to which the rule applies. Use <code>selected_accounts</code> to specific accounts and provide the corresponding <code>account_ids</code>. Use <code>all_accounts</code> to apply the rule across all accounts in the organization, <code>all_banks</code> for all bank accounts, or <code>all_credit_cards</code> for all credit card accounts. Allowed Values: <code>selected_accounts</code>, <code>all_accounts</code>, <code>all_banks</code>, <code>all_credit_cards</code>.'
      type: string
      example: selected_accounts
    target_accounts_formatted:
      description: Comma-separated display string of bank and credit card account names to which the rule applies
      type: string
      example: Savings Account, Checking Account
    account_ids:
      description: Comma-separated list of account IDs to which the rule applies. Applicable only when <code>rule_category</code> is <code>selected_accounts</code>. Do not send this parameter when <code>rule_category</code> is <code>all_accounts</code>, <code>all_banks</code>, or <code>all_credit_cards</code>.
      type: string
      example: 460000000000361,460000000048001
    get-rules-list-response:
      type: object
      properties:
        code:
          type: integer
          example: 0
          readOnly: true
        message:
          type: string
          example: success
          readOnly: true
        rules:
          type: array
          items:
            $ref: '#/components/schemas/rules-response'
    create-a-rule-request:
      required:
        - rule_name
        - rule_category
        - apply_to
        - criteria_type
        - criterion
        - record_as
      type: object
      properties:
        rule_name:
          $ref: '#/components/schemas/rule_name'
        rule_category:
          $ref: '#/components/schemas/rule_category'
        account_ids:
          $ref: '#/components/schemas/account_ids'
        apply_to:
          description: 'Specifies whether the rule applies to deposits or withdrawals. This applies to both bank accounts and credit card accounts. Allowed Values: <code>deposits</code>, <code>withdrawals</code>.'
          type: string
          example: deposits
        criteria_type:
          description: 'Specifies whether all the criteria have to be satisfied or not. Allowed Values : <code>and</code> and <code>or</code>'
          type: string
          example: and
        auto_categorize:
          $ref: '#/components/schemas/auto_categorize'
        criterion:
          type: array
          description: List of criteria used to define conditions for applying the bank rule.
          items:
            type: object
            properties:
              field:
                $ref: '#/components/schemas/field'
              comparator:
                $ref: '#/components/schemas/comparator'
              value:
                $ref: '#/components/schemas/value'
        record_as:
          description: 'Record the transaction based on the value specified in the apply_to node. For bank accounts: If apply_to is deposits: sales_without_invoices, transfer_fund, interest_income, other_income, expense_refund, deposit. If apply_to is withdrawals: expense, transfer_fund, card_payment, owner_drawings. For credit card accounts: If apply_to is deposits: card_payment, transfer_fund, expense_refund, refund. If apply_to is withdrawals: expense, transfer_fund. Allowed Values: <code>expense</code>, <code>deposit</code>, <code>refund</code>, <code>transfer_fund</code>, <code>card_payment</code>, <code>sales_without_invoices</code>, <code>expense_refund</code>, <code>interest_income</code>, <code>other_income</code>, <code>owner_drawings</code>.'
          type: string
          example: deposit
        account_id:
          description: Account which is involved in the rule with the target account.
          type: string
          example: 460000000049001
        customer_id:
          description: ID of the customer.(Applicable for sales_without_invoices,deposit, expense)
          type: string
          example: 46000000000111
        tax_id:
          $ref: '#/components/schemas/tax_id'
        reference_number:
          description: 'Specifies if Reference number is manual or generated from the statement. Allowed Values: <code>manual</code> and <code>from_statement</code>'
          type: string
          example: manual
        vat_treatment:
          $ref: '#/components/schemas/vat_treatment'
        tax_treatment:
          $ref: '#/components/schemas/tax_treatment'
        is_reverse_charge_applied:
          $ref: '#/components/schemas/is_reverse_charge_applied'
        product_type:
          $ref: '#/components/schemas/product_type'
        tax_authority_id:
          $ref: '#/components/schemas/tax_authority_id'
        tax_exemption_id:
          $ref: '#/components/schemas/tax_exemption_id'
        location_id:
          $ref: '#/components/schemas/location_id'
    create-a-rule-response:
      type: object
      properties:
        code:
          type: integer
          example: 0
          readOnly: true
        message:
          type: string
          example: The bank rule has been created.
          readOnly: true
        rule:
          $ref: '#/components/schemas/rule'
    get-a-rule-response:
      type: object
      properties:
        code:
          type: integer
          example: 0
          readOnly: true
        message:
          type: string
          example: success
          readOnly: true
        rule_id:
          $ref: '#/components/schemas/rule_id'
        rule_name:
          $ref: '#/components/schemas/rule_name'
        rule_order:
          $ref: '#/components/schemas/rule_order'
        rule_category:
          $ref: '#/components/schemas/rule_category'
        target_accounts:
          $ref: '#/components/schemas/target_accounts'
        accounts:
          $ref: '#/components/schemas/accounts'
        target_accounts_count:
          $ref: '#/components/schemas/target_accounts_count'
        apply_to:
          $ref: '#/components/schemas/apply_to'
        criteria_type:
          $ref: '#/components/schemas/criteria_type'
        auto_categorize:
          $ref: '#/components/schemas/auto_categorize'
        location_id:
          $ref: '#/components/schemas/location_id'
        location_name:
          $ref: '#/components/schemas/location_name'
        criterion:
          $ref: '#/components/schemas/criterion'
        record_as:
          $ref: '#/components/schemas/record_as'
        account_id:
          $ref: '#/components/schemas/account_id'
        account_name:
          $ref: '#/components/schemas/account_name'
        tax_id:
          $ref: '#/components/schemas/tax_id'
        customer_id:
          $ref: '#/components/schemas/customer_id'
        customer_name:
          $ref: '#/components/schemas/customer_name'
        reference_number:
          $ref: '#/components/schemas/reference_number'
        payment_mode:
          $ref: '#/components/schemas/payment_mode'
        vat_treatment:
          $ref: '#/components/schemas/vat_treatment'
        tax_treatment:
          $ref: '#/components/schemas/tax_treatment'
        is_reverse_charge_applied:
