openapi: 3.0.0
info:
  title: Contacts
  description: The list of contacts created.
  contact: {}
  version: 1.0.0
servers:
  - url: https://www.zohoapis.com/books/v3
    description: API Endpoint
tags:
  - name: contacts
    description: Contacts Module
paths:
  /contacts:
    x-mcp-group:
      - Contacts
    post:
      tags:
        - contacts
      operationId: create_contact
      summary: Create a Contact
      description: Create a new contact with comprehensive business information. This operation allows you to create a customer or vendor by providing details such as contact name, company information, addresses, contact persons, payment terms, tax settings, and custom fields. The created contact can be used for generating invoices, bills, estimates, and other business transactions. The system automatically assigns a unique contact ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-a-contact-request'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-a-contact-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.CREATE
    get:
      tags:
        - contacts
      operationId: list_contacts
      summary: List Contacts
      description: Retrieve a comprehensive list of all contacts with advanced filters. This operation supports multiple search criteria including contact name, company name, address, email, phone, and general text search. You can filter contacts by status (active, inactive, duplicate, CRM) and sort by various fields. The response includes essential contact information, financial data including outstanding amounts and credit limits, and pagination details for efficient data retrieval.
      parameters:
        - name: contact_type
          in: query
          description: 'Search contacts by contact type. Allowed Values: <code>customer</code>, <code>vendor</code>.'
          required: false
          schema:
            type: string
          example: customer
        - name: contact_name
          in: query
          description: 'Search contacts by contact name. Max-length [100] Variants: <code>contact_name_startswith</code> and <code>contact_name_contains</code>. Max-length [100]'
          required: false
          schema:
            type: string
          example: Bowman and Co
        - name: company_name
          in: query
          description: 'Search contacts by company name. Max-length [100] Variants: <code>company_name_startswith</code> and <code>company_name_contains</code>'
          required: false
          schema:
            type: string
          example: Bowman and Co
        - name: first_name
          in: query
          description: 'Search contacts by first name of the primary contact person. Max-length [100] Variants: <code>first_name_startswith</code> and <code>first_name_contains</code>'
          required: false
          schema:
            type: string
          example: Will
        - name: last_name
          in: query
          description: 'Search contacts by last name of the primary contact person. Max-length [100] Variants: <code>last_name_startswith</code> and <code>last_name_contains</code>'
          required: false
          schema:
            type: string
          example: Smith
        - name: address
          in: query
          description: 'Search contacts by any of the address fields. Max-length [100] Variants: <code>address_startswith</code> and <code>address_contains</code>'
          required: false
          schema:
            type: string
          example: 4900 Hopyard Rd
        - name: email
          in: query
          description: 'Search contacts by email of the primary contact person. Max-length [100] Variants: <code>email_startswith</code> and <code>email_contains</code>'
          required: false
          schema:
            type: string
          example: willsmith@bowmanfurniture.com
        - name: phone
          in: query
          description: 'Search contacts by phone number of the primary contact person. Max-length [100] Variants: <code>phone_startswith</code> and <code>phone_contains</code>'
          required: false
          schema:
            type: string
          example: +1-925-921-9201
        - name: filter_by
          in: query
          description: 'Filter contacts by status. Allowed Values: <code>Status.All, Status.Active, Status.Inactive, Status.Duplicate, Status.PortalEnabled, Status.PortalDisabled, Invoice.OverDue, Invoice.Unpaid, Status.CreditLimitExceed and Status.Crm</code>'
          required: false
          schema:
            type: string
          example: ''
        - name: search_text
          in: query
          description: Search contacts by contact name or notes. Max-length [100]
          required: false
          schema:
            type: string
          example: ''
        - name: sort_column
          in: query
          description: 'Sort contacts. Allowed Values: <code>contact_name, first_name, last_name, email, outstanding_receivable_amount, created_time and last_modified_time</code>'
          required: false
          schema:
            type: string
          example: contact_name
        - name: zcrm_contact_id
          in: query
          description: 'CRM Contact ID for the contact. Note: This value is a set of numeric characters.'
          required: false
          schema:
            type: string
          example: 460000000026049
        - name: zcrm_account_id
          in: query
          description: 'CRM Account ID for the contact. Note: This value is a set of numeric characters.'
          required: false
          schema:
            type: string
          example: 460000000026049
        - name: zcrm_vendor_id
          in: query
          description: 'CRM Vendor ID for the contact. Note: This value is a set of numeric characters.'
          required: false
          schema:
            type: string
          example: 460000000026049
        - name: page
          in: query
          description: Page number to be fetched. Default value is 1.
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: per_page
          in: query
          description: Number of records to be fetched per page.
          required: false
          schema:
            type: integer
            default: 10
          example: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list-contacts-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.READ
    put:
      tags:
        - contacts
      operationId: update_contact_using_custom_field
      summary: Update a contact using a custom field's unique value
      description: A custom field will have unique values if it's configured to not accept duplicate values. Now, you can use that custom field's value to update a contact by providing its API name in the X-Unique-Identifier-Key header and its value in the X-Unique-Identifier-Value header. Based on this value, the corresponding contact will be retrieved and updated. Additionally, there is an optional X-Upsert header. If the X-Upsert header is true and the custom field's unique value is not found in any of the existing contacts, a new contact will be created if the necessary payload details are available
      parameters:
        - name: X-Unique-Identifier-Key
          in: header
          description: Unique CustomField Api Name
          required: true
          schema:
            type: string
            example: cf_unique_cf
        - name: X-Unique-Identifier-Value
          in: header
          description: Unique CustomField Value
          required: true
          schema:
            type: string
            example: unique Value
        - name: X-Upsert
          in: header
          description: If there is no record is found unique custom field value , will create new invoice
          required: false
          schema:
            type: boolean
            example: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-a-contact-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-a-contact-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.UPDATE
    delete:
      tags:
        - contacts
      operationId: delete_contacts
      summary: Delete contacts
      description: Delete one or more contacts.
      parameters:
        - name: contact_ids
          in: query
          required: true
          description: 'Comma-separated IDs of the contacts to delete. Note: This value is a set of numeric characters separated by comma.'
          schema:
            type: string
          example: 460000000026049,460000000026055
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-contacts-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.DELETE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /contacts/{contact_id}/owner:
    x-mcp-group:
      - Contacts
    post:
      tags:
        - contacts
      operationId: assign_contact_owner
      summary: Assign an Owner to a Contact
      description: Assign a user as the owner of a specific contact. Use this when a contact must be associated with a particular user for ownership and access purposes.
      parameters:
        - name: contact_id
          in: path
          required: true
          description: ID of the contact.
          schema:
            type: string
          example: 460000000026049
        - name: owner_id
          in: query
          required: false
          description: ID of the user to assign as the contact owner.
          schema:
            type: string
          example: 460000000031043
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contact-owner-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.CREATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /contacts/owner:
    x-mcp-group:
      - Contacts
    post:
      tags:
        - contacts
      operationId: assign_owner_to_contacts
      summary: Assign an Owner to Multiple Contacts
      description: Assign a user as the owner of multiple contacts in a single request. Use this to bulk-assign ownership for a set of contacts.
      parameters:
        - name: contact_ids
          in: query
          required: true
          description: Comma-separated IDs of the contacts to assign the owner to. Maximum of 200 contacts per request.
          schema:
            type: string
          example: 460000000026049,460000000026051
        - name: owner_id
          in: query
          required: false
          description: ID of the user to assign as the contact owner.
          schema:
            type: string
          example: 460000000031043
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contact-owner-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.CREATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /contacts/track1099:
    x-mcp-group:
      - Contacts
    post:
      tags:
        - contacts
      operationId: mark_contacts_for_1099_tracking
      summary: Mark Multiple Contacts for 1099 Tracking
      description: Enable 1099 tracking for multiple contacts in a single request. Applicable to organizations in the United States edition that report vendor payments for 1099 purposes.
      parameters:
        - name: contact_ids
          in: query
          required: false
          description: Comma-separated IDs of the contacts to mark for 1099 tracking. Maximum of 200 contacts per request.
          schema:
            type: string
          example: 460000000026049,460000000026051
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contact-1099-tracking-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.CREATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /contacts/{contact_id}/bankaccount/{bank_account_id}/verify:
    x-mcp-group:
      - Contacts
    post:
      tags:
        - contacts
      operationId: verify_contact_bank_account
      summary: Verify a Contact Bank Account
      description: Verify a contact bank account using the two micro-deposit amounts credited to the account. Provide the deposit amounts to confirm ownership of the bank account.
      parameters:
        - name: contact_id
          in: path
          required: true
          description: ID of the contact.
          schema:
            type: string
          example: 460000000026049
        - name: bank_account_id
          in: path
          required: true
          description: ID of the contact bank account to verify.
          schema:
            type: string
          example: 460000000031055
        - name: first_deposit_amount
          in: query
          required: false
          description: First micro-deposit amount credited to the bank account.
          schema:
            type: integer
          example: 12
        - name: second_deposit_amount
          in: query
          required: false
          description: Second micro-deposit amount credited to the bank account.
          schema:
            type: integer
          example: 34
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/verify-bank-account-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.CREATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /contacts/address/verify:
    x-mcp-group:
      - Contacts
    get:
      tags:
        - contacts
      operationId: verify_contact_address
      summary: Verify a Contact Address
      description: Validate a contact address against the provided address fields. Use this before creating or updating a contact to confirm that the address is valid.
      parameters:
        - name: line1
          in: query
          required: true
          description: First line of the address. Max-length [60].
          schema:
            type: string
          example: 7 Hales Court
        - name: city
          in: query
          required: false
          description: City of the address. Max-length [50].
          schema:
            type: string
          example: New York
        - name: region
          in: query
          required: false
          description: State or region of the address. Max-length [50].
          schema:
            type: string
          example: NY
        - name: country
          in: query
          required: false
          description: Country of the address. Max-length [50].
          schema:
            type: string
          example: U.S.A
        - name: postal_code
          in: query
          required: false
          description: Postal code of the address. Max-length [30].
          schema:
            type: string
          example: '10004'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/verify-address-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.READ
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /contacts/{contact_id}/card/{card_id}/recurringinvoices:
    x-mcp-group:
      - Contacts
    get:
      tags:
        - contacts
      operationId: list_contact_autobill_recurring_invoices
      summary: List Auto-bill Recurring Invoices for a Contact Card
      description: Retrieve the recurring invoices set to be auto-billed against a specific card of a contact. Use this to review which recurring invoices are linked to a contact card for automatic payment.
      parameters:
        - name: contact_id
          in: path
          required: true
          description: ID of the contact.
          schema:
            type: string
          example: 460000000026049
        - name: card_id
          in: path
          required: true
          description: ID of the contact card.
          schema:
            type: string
          example: 460000000031067
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list-contact-autobill-recurring-invoices-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.READ
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /customers:
    x-mcp-group:
      - Customers
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /vendors:
    x-mcp-group:
      - Customers
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /contacts/{contact_id}:
    x-mcp-group:
      - Contacts
    parameters:
      - name: contact_id
        in: path
        required: true
        description: 'Unique identifier of the contact. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: 460000000026049
      - $ref: '#/components/parameters/organization_id'
    put:
      tags:
        - contacts
      operationId: update_contact
      summary: Update a Contact
      description: Update an existing contact with comprehensive business information. This operation allows you to modify all contact details including basic information, addresses, contact persons, payment terms, tax settings, and custom fields. For contact person, you can add new contact persons, update existing ones, or remove them by excluding them from the contact_persons list.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-a-contact-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-a-contact-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.UPDATE
    get:
      tags:
        - contacts
      operationId: get_contact
      summary: Get Contact
      description: Retrieve comprehensive details of a specific contact. This operation provides complete contact details such as basic information, addresses, contact persons, payment terms, tax settings, custom fields, and financial data including outstanding amounts, credit limits, and transaction history.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-contact-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.READ
    delete:
      tags:
        - contacts
      operationId: delete_contact
      summary: Delete a Contact
      description: Delete an existing contact.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-a-contact-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.DELETE
  /contacts/{contact_id}/active:
    x-mcp-group:
      - Contacts
    post:
      tags:
        - contacts
      operationId: mark_contact_active
      summary: Mark as Active
      description: Mark a contact as active.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-as-active-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.CREATE
    parameters:
      - name: contact_id
        in: path
        required: true
        description: 'Unique identifier of the contact. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: 460000000026049
      - $ref: '#/components/parameters/organization_id'
  /contacts/{contact_id}/inactive:
    x-mcp-group:
      - Contacts
    post:
      tags:
        - contacts
      operationId: mark_contact_inactive
      summary: Mark as Inactive
      description: Mark a contact as inactive.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-as-inactive-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.CREATE
    parameters:
      - name: contact_id
        in: path
        required: true
        description: 'Unique identifier of the contact. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: 460000000026049
      - $ref: '#/components/parameters/organization_id'
  /contacts/{contact_id}/portal/enable:
    x-mcp-group:
      - Contacts
    post:
      tags:
        - contacts
      operationId: enable_contact_portal
      summary: Enable Portal Access
      description: Enable portal access for a contact.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/enable-portal-access-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/enable-portal-access-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.CREATE
    parameters:
      - name: contact_id
        in: path
        required: true
        description: 'Unique identifier of the contact. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: 460000000026049
      - $ref: '#/components/parameters/organization_id'
  /contacts/{contact_id}/paymentreminder/enable:
    x-mcp-group:
      - Contacts
    post:
      tags:
        - contacts
      operationId: enable_contact_payment_reminder
      summary: Enable Payment Reminders
      description: Enable automated payment reminders for a contact.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/enable-payment-reminders-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.CREATE
    parameters:
      - name: contact_id
        in: path
        required: true
        description: 'Unique identifier of the contact. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: 460000000026049
      - $ref: '#/components/parameters/organization_id'
  /contacts/{contact_id}/paymentreminder/disable:
    x-mcp-group:
      - Contacts
    post:
      tags:
        - contacts
      operationId: disable_contact_payment_reminder
      summary: Disable Payment Reminders
      description: Disable automated payment reminders for a contact.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/disable-payment-reminders-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.CREATE
    parameters:
      - name: contact_id
        in: path
        required: true
        description: 'Unique identifier of the contact. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: 460000000026049
      - $ref: '#/components/parameters/organization_id'
  /contacts/{contact_id}/statements/email:
    x-mcp-group:
      - Contacts
    post:
      tags:
        - contacts
      operationId: email_contact_statement
      summary: Email Statement
      description: Email statement to the contact. If JSONString is not inputted, mail will be sent with the default mail content.
      parameters:
        - name: start_date
          in: query
          description: If start_date and end_date are not given, current month's statement will be sent to contact. Date format [yyyy-mm-dd]
          required: false
          schema:
            type: string
          example: ''
        - name: end_date
          in: query
          description: End date for the statement. Date format [yyyy-mm-dd]
          required: false
          schema:
            type: string
          example: ''
        - name: multipart_or_formdata
          in: query
          description: Files to be attached along with the statement.
          required: false
          schema:
            type: string
          example: file
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email-statement-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email-statement-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.CREATE
    get:
      tags:
        - contacts
      operationId: get_contact_statement_mail
      summary: Get Statement Mail Content
      description: Get the statement mail content.
      parameters:
        - name: start_date
          in: query
          description: If start_date and end_date are not given, current month's statement will be sent to contact. Date format [yyyy-mm-dd]
          required: false
          schema:
            type: string
          example: ''
        - name: end_date
          in: query
          description: End date for the statement. Date format [yyyy-mm-dd]
          required: false
          schema:
            type: string
          example: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-statement-mail-content-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.READ
    parameters:
      - name: contact_id
        in: path
        required: true
        description: 'Unique identifier of the contact. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: 460000000026049
      - $ref: '#/components/parameters/organization_id'
  /contacts/{contact_id}/email:
    x-mcp-group:
      - Contacts
    get:
      tags:
        - contacts
      operationId: get_contact_email_content
      summary: Get contact email content
      description: Retrieve the default email content used when emailing a contact.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-contact-email-content-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.READ
    post:
      tags:
        - contacts
      operationId: email_contact
      summary: Email Contact
      description: Send email to contact.
      parameters:
        - name: send_customer_statement
          in: query
          description: Send customer statement pdf with email.
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email-contact-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/email-contact-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.contacts.CREATE
    parameters:
      - name: contact_id
        in: path
        required: true
        description: 'Unique identifier of the contact. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: 460000000026049
      - $ref: '#/components/parameters/organization_id'
